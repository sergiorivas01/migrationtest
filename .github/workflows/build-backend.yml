name: Build Backend

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "backend/tsconfig.json"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "backend/tsconfig.json"

jobs:
  backend:
    name: Type Check y Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check backend
        run: npx tsc -p backend --noEmit

      - name: Build backend
        run: npm run build:backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
