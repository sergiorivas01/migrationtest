name: Deploy Backend

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch: # Allow manual execution

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev
        working-directory: backend

      - name: Check for migrations
        run: |
          if [ -z "$(ls -A backend/migrations/*.js 2>/dev/null)" ]; then
            echo "No migrations found, skipping..."
            exit 0
          fi
          echo "Found migrations:"
          ls -la backend/migrations/

      - name: Run migrations
        id: migrate
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
        working-directory: backend
        run: |
          echo "Running database migrations..."
          if npm run migrate:up; then
            echo "Migrations completed successfully"
            echo "migration_status=success" >> $GITHUB_OUTPUT
          else
            echo "Migration failed with exit code $?"
            echo "migration_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check migration status
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "::error::Database migrations failed! Deployment will not proceed."
          echo "Please check the migration logs above for details."
          exit 1

  backend:
    name: Type Check and Build Backend
    runs-on: ubuntu-latest
    needs: migrate
    if: needs.migrate.result == 'success' || needs.migrate.result == 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Type Check backend
        run: npx tsc -p . --noEmit
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json package-lock.json deploy-package/
        working-directory: backend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/deploy-package
